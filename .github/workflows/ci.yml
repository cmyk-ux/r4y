name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Validate the PowerShell installer and read-only preflight
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./scripts/install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          ./scripts/install.ps1 -OptionString '--dry-run'
          $installerPath = (Resolve-Path ./scripts/install.ps1).Path
          $workspaceRoot = Split-Path -Parent (Split-Path -Parent $installerPath)
          if (-not (Test-Path (Join-Path $workspaceRoot 'Cargo.toml')) -or
              -not (Test-Path (Join-Path $workspaceRoot 'apps/r4y/Cargo.toml'))) {
            throw "Installer resolved an invalid workspace root: $workspaceRoot"
          }
          Write-Host "Installer workspace root: $workspaceRoot"
      - name: Validate MSVC environment initialization
        shell: pwsh
        run: ./scripts/install.ps1 -OptionString '--check-msvc'
      - name: Validate native stderr handling in Windows PowerShell 5.1
        shell: pwsh
        run: ./scripts/install.ps1 -OptionString '--test-native-output'
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Build the one user-facing R4Y executable.
      - name: Build R4Y
        run: cargo build --release --locked -p r4y
      # Keep the architecture-specific Wave32/Wave64 hardware references
      # local, but run the structured-buffer gather path on both hardware and
      # WARP: its CPU-reference checks are valid on any supported D3D12 device.
      - name: Tests
        env:
          R4Y_D3D12_WARP: "1"
        run: cargo test --workspace --locked -- --skip permutes_read_the_lane_named_and_zero_from_lanes_left_out --skip wave64_split_matches_console_on_d3d12_hardware
      # Keep the skip reason visible: a green hosted-runner job is not proof
      # that the lane-by-lane D3D12 test found a suitable adapter.
      - name: Verify wave64 split and console flow on D3D12 hardware
        run: cargo test -p r4y-shader --locked wave64_split_matches_console_on_d3d12_hardware -- --show-output
